<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Modern To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Notification -->
    <div id="notification" class="notification">
        <div class="notification-header">
            <div class="notification-title">Task Reminder</div>
            <button class="notification-close" onclick="closeNotification()">×</button>
        </div>
        <div class="notification-body" id="notificationBody"></div>
    </div>

    <div class="header">
        <h1>TaskFlow</h1>
        <p>Organize your day, one task at a time</p>
    </div>

    <div class="container">
        <!-- Input section -->
        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="What needs to be done?"
            >
            <div class="datetime-row">
                <div class="datetime-group">
                    <label class="input-label">Start Date</label>
                    <input type="date" id="taskDate">
                </div>
                <div class="datetime-group">
                    <label class="input-label">Start Time</label>
                    <input type="time" id="taskTime">
                </div>
            </div>
            <div class="datetime-row">
                <div class="datetime-group">
                    <label class="input-label">Due Date</label>
                    <input type="date" id="taskDueDate">
                </div>
                <div class="datetime-group">
                    <label class="input-label">Reminder Time</label>
                    <input type="time" id="reminderTime">
                </div>
            </div>
            <button id="addBtn">Add Task</button>
        </div>

        <!-- Stats section -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="totalTasks">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="activeTasks">0</span>
                <span class="stat-label">Active</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="completedTasks">0</span>
                <span class="stat-label">Completed</span>
            </div>
        </div>

        <!-- Week filter tabs -->
        <div class="week-filter" id="weekFilter">
            <!-- Week tabs will be generated here -->
        </div>

        <!-- Task list -->
        <ul id="taskList">
            <!-- Tasks will be added here dynamically -->
        </ul>
    </div>

<script src="script.js"></script>
</body>
</html>
